# SPDX-License-Identifier: GPL-3.0-only
# A fresh clone builds: on every push and pull request, without the JieLi toolchain. Nothing generated is in git:
# tools/build.py --gen-only writes build/gen (fonts, icons, keycaps, palettes, tables, samples), then the single unit
# firmware/src/rakt.c compiles for an ARM target (every include there), the headless emulator builds from it
# and plays a short script, the host tests run, and the tree git tracks is left as it was. What anyone building from
# source needs first, and the firmware hub's converter (thefirmwarehub.com/convert) with them.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # as release.yml: the generated headers (fonts with Raqm) depend on these versions
  PYTHON_VERSION: "3.11"
  PILLOW_VERSION: "11.1.0"
  FONTTOOLS_VERSION: "4.66.1"

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python packages (Pillow with Raqm, fontTools)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0
          python3 -m pip install --disable-pip-version-check "Pillow==$PILLOW_VERSION" "fonttools==$FONTTOOLS_VERSION"

      - name: Generated headers (tools/build.py --gen-only)
        run: python3 tools/build.py --gen-only

      - name: Device resource audit parser and build-flag consistency
        run: python3 tests/resource_audit_test.py

      - name: RAKT public branding and release provenance
        run: |
          python3 tools/audit_public_release.py
          python3 tools/test_hub_submission.py

      - name: The unit compiles (an ARM target, every include present)
        run: |
          clang -target armv7m-none-eabi -Os -fno-builtin -w -Ifirmware/hal -Ifirmware/src -Ibuild/gen \
                -fsyntax-only firmware/src/rakt.c

      - name: The headless emulator builds and plays
        run: |
          set -euo pipefail
          printf 'wait 1500\nkey 7 down\nwait 400\nkey 7 up\nwait 300\nbtn SEQ\nwait 300\nbtn SEQ\nwait 300\ndump\n' \
              > build/smoke.txt
          sh tools/emu/cf_headless.sh build/smoke.txt build/smoke | tail -20

      - name: Chord Lab theory, suggestions, ownership, undo and audio regressions
        run: sh tools/test_lab.sh

      - name: Host tests
        run: |
          set -euo pipefail
          mkdir -p build/host
          # (the emulator's <os/lock.h> is macOS's; tools/emu/web/compat has the single-threaded one, as the headless build)
          cc -std=gnu11 -O1 -w -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src -Itests -o build/host/cf_backup_test \
             tests/cf_backup_test.c -lm
          build/host/cf_backup_test
          cc -std=c99 -Wall -Wextra -Ifirmware/src -o build/cf_chord_test tests/cf_chord_test.c firmware/src/cf_chord.c \
             firmware/src/cf_harmony.c firmware/src/cf_theory.c
          build/cf_chord_test
          cc -std=c99 -Wall -Wextra -Ifirmware/src -o build/host/cf_theory_test tests/cf_theory_test.c firmware/src/cf_theory.c
          build/host/cf_theory_test
          cc -std=gnu11 -O2 -w -Ibuild/gen -Ifirmware/src -o build/host/cr_va_test tests/cr_va_test.c -lm
          build/host/cr_va_test
          cc -std=gnu11 -O2 -Wall -Wno-unused-function -Ifirmware/src -o build/host/st_log_test tests/st_log_test.c
          build/host/st_log_test

      - name: USB audio protocol and real-render regression tests (host HAL)
        run: sh tools/test_usb.sh

      - name: RAKT library, saved sounds, HOME views and 6/8 timing (host HAL)
        run: sh tools/test_chase3.sh

      - name: Built-in drum bank, stable IDs, sequencer copies and real audio (host HAL)
        run: sh tools/test_drum_bank.sh

      - name: Chord/drum voice isolation and retained overload guard
        run: sh tools/test_chord_drum_budget.sh

      - name: Keyboard guide, inactive knobs and live key ownership
        run: sh tools/test_keyboard.sh

      - name: Drum fills, drops, downbeat returns and Motion Off
        run: sh tools/test_perform.sh

      - name: FX presets, safe storage and performance controls (host HAL)
        run: sh tools/test_fx_presets.sh

      - name: FX macros, combined readout and audio isolation
        run: sh tools/test_fx.sh

      - name: Auto harmony, controls, persistence, MIDI and recording (host HAL)
        run: sh tools/test_auto.sh

      - name: Signature 8 exact patches, stable IDs, filters and real-engine fixtures
        run: sh tools/test_signature8.sh

      - name: RAKT Engine arrangement, regeneration and four-cycle real audio trace
        run: sh tools/test_engine.sh

      - name: G0 scheduled ARP, Feel boundaries, Space and level-matched patch audition
        run: sh tools/test_g0.sh

      - name: G1 catalog, musical memory, Repeat/Jam and live Vibe switching
        run: sh tools/test_g1.sh

      - name: Studio generator
        run: sh tools/test_studio.sh

      - name: Contextual variations, undo and safe playback boundaries (host HAL)
        run: sh tools/test_variations.sh

      - name: Progression suggestions, controls and uninterrupted audio (host HAL)
        run: sh tools/test_progressions.sh

      - name: Songs library, complete recall and safe persistence
        run: sh tools/test_library.sh

      - name: Native semantic editor, shared-clock boundaries and checkpoint power cuts
        run: sh tools/test_editor.sh

      - name: All native screens, interrupted motion and unchanged audio / USB / MIDI
        run: sh tools/test_native_pages.sh

      - name: Semantic phrase, protected draft and wire-format validation
        run: sh tools/test_song.sh

      - name: Accompaniment workspace, play once, clock loss and Click preferences
        run: sh tools/test_accomp_workspace.sh

      - name: HOME banks, retained view routes and unchanged audio
        run: sh tools/test_home_banks.sh

      - name: Native HOME, appearance migration and settled Motion Off
        run: sh tools/test_stage.sh

      - name: Mascot artwork bounds, motion and character preference migration
        run: sh tools/test_mascots.sh

      - name: RAKT boot, rack and meter animation, startup timing and sparse font fallback
        run: sh tools/test_rakt_boot.sh

      - name: RAKT chime, finite fade, preference and first-key physical/USB/MIDI priority
        run: sh tools/test_boot_sound.sh

      - name: Visual ARP, all patterns, ownership and physical/USB/MIDI isolation
        run: sh tools/test_arp.sh

      - name: Progression accompaniment transport, queues, ownership and clocks
        run: sh tools/test_accomp.sh

      - name: Three recordings, legacy archives, save power cuts and flash boundaries
        run: sh tools/test_recordings.sh

      - name: Full installer, update and backup regression suite
        run: node web/test_installer.mjs

      - name: Diagnostics snapshots, HOME controls and performance report protocol (host HAL)
        run: sh tools/test_diagnostics.sh

      - name: Scene-free boot, legacy saves and cross-profile physical/USB/MIDI audio
        run: sh tools/test_scene_free.sh

      - name: Optional legacy scenes, Top Lock and bass boot (host HAL)
        run: sh tools/test_visuals.sh

      - name: The tracked tree is as it was
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain --untracked-files=no)"
