# SPDX-License-Identifier: GPL-3.0-only
# A fresh clone builds: on every push and pull request, without the JieLi toolchain. Nothing generated is in git:
# tools/build.py --gen-only writes build/gen (fonts, icons, keycaps, palettes, tables, samples), then the single unit
# firmware/src/rakt.c compiles for an ARM target (every include there), the headless emulator builds from it
# and plays a short script, the host tests run, and the tree git tracks is left as it was. What anyone building from
# source needs first, and the firmware hub's converter (thefirmwarehub.com/convert) with them.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # as release.yml: the generated headers (fonts with Raqm) depend on these versions
  PYTHON_VERSION: "3.11"
  PILLOW_VERSION: "11.1.0"
  FONTTOOLS_VERSION: "4.66.1"

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python packages (Pillow with Raqm, fontTools)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0
          python3 -m pip install --disable-pip-version-check "Pillow==$PILLOW_VERSION" "fonttools==$FONTTOOLS_VERSION"

      - name: Generated headers (tools/build.py --gen-only)
        run: python3 tools/build.py --gen-only

      - name: Device resource audit parser and build-flag consistency
        run: python3 tests/resource_audit_test.py

      - name: RAKT public branding and release provenance
        run: |
          python3 tools/audit_public_release.py
          python3 tools/test_hub_submission.py

      - name: The unit compiles (an ARM target, every include present)
        run: |
          clang -target armv7m-none-eabi -Os -fno-builtin -w -Ifirmware/hal -Ifirmware/src -Ibuild/gen \
                -fsyntax-only firmware/src/rakt.c

      - name: RAKT host regression suite
        run: sh tools/test_rakt.sh

      - name: The tracked tree is as it was
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain --untracked-files=no)"
